<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git / Github</title>
  <style>
    :root {
      --bg-start: #f2efe7;
      --bg-end: #d6e4f0;
      --text: #1f2937;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --surface: #ffffffcc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, var(--bg-start), var(--bg-end));
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.5rem 1rem;
    }

    .content {
      flex: 1;
      width: 100%;
      display: grid;
      place-items: center;
    }

    .hero {
      width: min(860px, 100%);
      background: var(--surface);
      border: 1px solid #ffffff;
      border-radius: 18px;
      padding: 2.5rem;
      box-shadow: 0 14px 40px rgba(31, 41, 55, 0.12);
      animation: fade-up 500ms ease-out both;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.08;
      margin-bottom: 1rem;
    }

    .hero p {
      max-width: 55ch;
      font-size: 1.1rem;
      line-height: 1.55;
      margin-bottom: 1.5rem;
    }

    .hero a {
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      transition: background-color 200ms ease, transform 200ms ease;
    }

    .hero a:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    footer {
      width: min(860px, 100%);
      margin: 1.2rem auto 0;
      text-align: center;
      font-size: 0.92rem;
      color: #334155;
      padding: 0.75rem 1rem;
      border-top: 1px solid #ffffff;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .hero {
        padding: 1.7rem;
      }

      .hero p {
        font-size: 1rem;
      }
    }
    nav { background: #f3f4f6; padding: 10px 16px; }
    nav a { color: #1f2937; text-decoration: none; margin-right: 14px; }
  </style>
</head>
<body>
  <nav>
    <a href="#">Inicio</a>
    <a href="#">Acerca</a>
    <a href="#">Contacto</a>
  </nav>
  <main class="content">
    <section class="hero">
      <h1>Aprende Git y GitHub en equipo</h1>
      <p>
        Colabora sin miedo: crea ramas, haz commits claros y publica cambios
        con un flujo simple para empezar hoy mismo.
      </p>
      <a href="#">Comenzar ahora</a>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Guia Git y GitHub. Hecho para practicar colaboracion.</p>
  </footer>
</body>
</html>
